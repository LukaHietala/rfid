<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
        <script src="{{ url_for('static', filename='utils.js') }}"></script>
        <link rel="stylesheet" href="{{ url_for('static', filename='index.css')}}">
	</head>
	<body>
        <main x-data>
            <p id="popup" class="popup"></p>
            {% if students %}
                <div class="student-list">
					<template x-for="student in $store.info.students">
						<div class="selected-item">
							<p style="font-size: large;" x-text="student.name"></p>
							<p class="extra" style="margin: 4px 0 0 0;
							font-size: small;">Töitä jäljellä: <span x-text="student.remaining"></span></p>
						</div>
					</template>
                </div>
            {% else %}
                <p >Ei oppilaita</p>
            {% endif %}
        </main>
	</body>	
	<script type="module">
        import { io } from "https://cdn.socket.io/4.8.3/socket.io.esm.min.js";
		import Alpine from 'https://cdn.jsdelivr.net/npm/alpinejs@3.16.2/+esm'
		const socket = io();
		window.Alpine = Alpine;

		Alpine.store('info', {
			students: [{name : "moi", status : "moi"}]
		})
		
		socket.on('new_scan', (data) => {
			const id = data.rfid_id;
			const name = data.name;
			const msg = data.msg;
			const status = data.status;
			const in_database = data.found;
            const card = document.getElementById(id)
    
			// Update table
			if (!in_database) {
               return popup(msg)
			}
            
            if (status === "IN") {
			    card.classList.remove("disabled-item")
			    card.classList.add("selected-item")
            } else {
			    card.classList.remove("selected-item")
			    card.classList.add("disabled-item")
            }

			const popupText = `Uusi skannaus: ${name} (${id})`
			popup(popupText);
		})
		Alpine.start();
	</script>
</html>
