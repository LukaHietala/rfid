<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
        <script src="{{ url_for('static', filename='utils.js') }}"></script>
        <link rel="stylesheet" href="{{ url_for('static', filename='index.css')}}">
	</head>
	<body>
        <main x-data>
            <p id="popup" class="popup"></p>
            <div class="student-list">
				<template x-for="student in $store.info.students">
					<div :class="student.status == 'IN' ? 'selected-item' : 'disabled-item'">
						<p style="font-size: large;" x-text="student.name"></p>
						<p class="extra" style="margin: 4px 0 0 0;
												font-size: small;">Töitä jäljellä:
							<span x-text="secondsToHuman(student.remaining)"></span>
						</p>
					</div>
				</template>
            </div>
        </main>
	</body>	
	<script type="module">
        import { io } from "/static/socketio.js";
		import Alpine from "/static/alpine.js";

		const socket = io();
		window.Alpine = Alpine;

        async function getStudents() {
			try {
				const response = await fetch("/api/students");
				if (!response.ok) {
					throw new Error("Jotain meni pieleen: " + response.status)
				}
				Alpine.store('info', {
					students: await response.json()
				});
			} catch (e) {
				console.error(e.message)
			} finally {
				studentTimer = setTimeout(() => {getStudents()}, 60 * 1000)
			}
        }
        await getStudents();
				
		socket.on('new_scan', (data) => {
			if (!data.found) {
				const msg = data.msg;
               return popup(msg)
			}
			const id = data.id;
			const name = data.name;
			const status = data.status;
			Alpine.store('info').students.find((student) => student.id == id).status = status;
			popup(`Uusi skannaus: ${name}`);
		})
			
		socket.on('new_student', (data) => {
			Alpine.store('info').students.push(data);
			popup(`Uusi oppilas: ${data.name}`);
		})

		socket.on('remove_student', (data) => {
			Alpine.store('info').students = Alpine.store('info').students.filter((student) => student.id != data.id);
			popup(`Poistettu oppilas: ${data.name}`);
		})
	
		socket.on('update_student', (data) => {
			const index = Alpine.store('info').students.findIndex((student) => student.id == data.id);
			Alpine.store('info').students[index] = data;
			popup(`Päivitetty oppilas: ${data.name}`);
		})

		Alpine.start();
	</script>
</html>
