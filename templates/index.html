<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
        <script src="{{ url_for('static', filename='utils.js') }}"></script>
		<title>Info</title>
	</head>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            margin: 0;
        }

        main {
            margin: 40px auto;
            max-width: 800px;
        }
        
        .student-list {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-gap: 30px;
            font-size: x-large;
        }
        
        p {
            margin: 0;
        }
        
        .selected-item {
            border: 2px solid #00a4e4;
            border-radius: 5px;
            padding: 30px;
            flex: 1 1 0px;
        }
        
        .selected-item .extra {
            color: #a19f9f;
        }
        
        .disabled-item {
            border: 2px solid #ccc;
            border-radius: 5px;
            padding: 30px;
            flex: 1 1 0px;
            color: #ccc !important;
        }
        
        .disabled-item .extra {
            color: #ccc;
        }

        .popup {
            text-align: center;
            margin: 0 0 30px 0;
        }

    </style>
	<body>
        <main>
            <p id="popup" class="popup"></p>
            <div class="student-list">
                {% for student in students %}
                <div id="{{ student.rfid_id }}" class="{{'selected-item' if student.status == 'IN' else 'disabled-item'}}">
                    <p style="font-size: x-large;">{{ student.name }}</p>
                    <p class="extra" style="margin: 4px 0 0 0; font-size: small;">Töitä jäljellä: {{ student.remaining }} s</p>
                </div>
                {% endfor %}
            </div>
        </main>
	</body>	
	<script type="module">
		import { io } from "https://cdn.socket.io/4.8.3/socket.io.esm.min.js";

		const socket = io()

		socket.on('new_scan', (data) => {
			const id = data.rfid_id;
			const name = data.name;
			const msg = data.msg;
			const status = data.status;
			const in_database = data.found;
            const card = document.getElementById(id)
    
			// Update table
			if (!in_database) {
               return popup(msg)
			}
            
            if (status === "IN") {
			    card.classList.remove("disabled-item")
			    card.classList.add("selected-item")
            } else {
			    card.classList.remove("selected-item")
			    card.classList.add("disabled-item")
            }

			const popupText = `Uusi skannaus: ${name} (${id})`
			popup(popupText);
		})
	</script>
</html>
