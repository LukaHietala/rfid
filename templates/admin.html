<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<script src="{{ url_for('static', filename='utils.js') }}"></script>
		<script src="{{ url_for('static', filename='calendar.js') }}"></script>
		<title>Admin</title>
		<style>
            * {
                box-sizing: border-box;
            }

            body {
                font-family: sans-serif;
                margin: 0;
            }

            main {
                margin: 40px auto;
                max-width: 1000px;
                padding: 0 20px;
            }

            .students-table {
                text-align: left;
                border: 1px solid gray;
                border-collapse: collapse;
                width: 100%;
            }

            .students-table th, td {
                padding: 8px 12px;
            }
			
			.disabled {
				opacity: 50%;
			}
		</style>
	</head>
	<body x-data="{ editing: false }">
        <main>
            <h1>Oppilaat</h1>
            <p id="popup" class="popup"></p>
            <form id="add" x-data="{ calendar_open: false }">
                <fieldset style="border: 1px solid gray; margin: 6px 0;">
                    <legend>Lisää oppilas</legend>
                    <label for="name">Nimi</label>
                    <input type="text" name="name" x-model="$store.add.name" required>
                    <label for="rfid_id">RFID ID (Skannaa tagi)</label>
                    <input type="text" name="name" x-model="$store.add.rfid_id" disabled required>
                    <button type="button" x-on:click="calendar_open = ! calendar_open">Kalenteri</button>
                    <button type="submit">Luo</button>
					<calendar-component id="add_calendar" x-show="calendar_open"></calendar-component>
                </fieldset>
            </form>
            <table id="table" class="students-table">
                <tr>
                    <th>Nimi</th>
                    <th>RFID ID</th>
                    <th>Tila</th>
                    <th>Kokonaistyöaika</th>
                    <th>Kalenteri</th>
                    <th>Toiminnot</th>
                </tr>
                <template x-for="student in $store.info.students">
                    <tr>
						<td x-text="student.name"></td>
                        <td x-text="student.rfid_id"></td>
                        <td x-text="student.status"></td>
                        <td x-text="secondsToHuman(student.done_seconds)"></td>
                        <td>
							<button x-on:click="openCalendar($event, student)">
								Avaa
							</button>
						</td>
                        <td>
                            <button x-on:click="editStudent(student)">
                                Muokkaa
                            </button>
                            <button x-on:click="deleteStudent(student)">
                                Poista
                            </button>
                        </td>
                    </tr>
                </template>
				<calendar-component id="popup_calendar"
				x-on:click.outside="removePopup" style="display:none;"></calendar-component>
            </table>
            <div x-show="$store.edit.editing">
                <form id="edit">
                    <fieldset style="border: 1px solid gray; margin: 6px 0; display: flex; flex-direction: row; gap: 12px;">
                        <legend x-text="`Muokataan: ${$store.edit.student.name}`"></legend>
                        <div>
                            <label for="name">Nimi</label><br>
                            <input type="text" id="name"
                                x-model="$store.edit.student.name"><br>			
                            <label for="status">Tila</label><br>
                            <select id="status"
                                x-model="$store.edit.student.status">
                                <option value="OUT">IN</option>
                                <option value="IN">OUT</option>
                            </select><br>
                            <label for="doneseconds">done_seconds</label><br>
                            <input type="text" id="doneseconds"
                                x-model="$store.edit.student.done_seconds"><br>
							<div style="display: flex; flex-direction: row; gap:10px;" x-data>
								<div style="display: flex; flex-direction: column; width: fit-content;
											gap:5px;"
									 :class="$store.edit.weekmask[0] ? '' : 'disabled'">
									<span style="text-align:center;">Ma</span>
									<input type="time"
										   x-model="$store.edit.schedule[0].start"
										   :disabled="!$store.edit.weekmask[0]"/>
									<input type="time"
										   x-model="$store.edit.schedule[0].end"
										   :disabled="!$store.edit.weekmask[0]"/>
									<input type="checkbox" x-model="$store.edit.weekmask[0]">
								</div>
								<div style="display: flex; flex-direction: column; width: fit-content;
											gap:5px;"
									 :class="$store.edit.weekmask[1] ? '' : 'disabled'">
									<span style="text-align:center;">Ti</span>
									<input type="time"
										   x-model="$store.edit.schedule[1].start"
										   :disabled="!$store.edit.weekmask[1]"/>
									<input type="time"
										   x-model="$store.edit.schedule[1].end"
										   :disabled="!$store.edit.weekmask[1]"/>
									<input type="checkbox" x-model="$store.edit.weekmask[1]">
								</div>
								<div style="display: flex; flex-direction: column; width: fit-content;
											gap:5px;"
									 :class="$store.edit.weekmask[2] ? '' : 'disabled'">
									<span style="text-align:center;">Ke</span>
									<input type="time"
										   x-model="$store.edit.schedule[2].start"
										   :disabled="!$store.edit.weekmask[2]"/>
									<input type="time"
										   x-model="$store.edit.schedule[2].end"
										   :disabled="!$store.edit.weekmask[2]"/>
									<input type="checkbox" x-model="$store.edit.weekmask[2]">
								</div>
								<div style="display: flex; flex-direction: column; width: fit-content;
											gap:5px;"
									 :class="$store.edit.weekmask[3] ? '' : 'disabled'">
									<span style="text-align:center;">To</span>
									<input type="time"
										   x-model="$store.edit.schedule[3].start"
										   :disabled="!$store.edit.weekmask[3]"/>
									<input type="time"
										   x-model="$store.edit.schedule[3].end"
										   :disabled="!$store.edit.weekmask[3]"/>
									<input type="checkbox" x-model="$store.edit.weekmask[3]">
								</div>
								<div style="display: flex; flex-direction: column; width: fit-content;
											gap:5px;"
									 :class="$store.edit.weekmask[4] ? '' : 'disabled'">
									<span style="text-align:center;">Pe</span>
									<input type="time"
										   x-model="$store.edit.schedule[4].start"
										   :disabled="!$store.edit.weekmask[4]"/>
									<input type="time"
										   x-model="$store.edit.schedule[4].end"
										   :disabled="!$store.edit.weekmask[4]"/>
									<input type="checkbox" x-model="$store.edit.weekmask[4]">
								</div>
								<div style="display: flex; flex-direction: column; width: fit-content;
											gap:5px;"
									 :class="$store.edit.weekmask[5] ? '' : 'disabled'">
									<span style="text-align:center;">La</span>
									<input type="time"
										   x-model="$store.edit.schedule[5].start"
										   :disabled="!$store.edit.weekmask[5]"/>
									<input type="time"
										   x-model="$store.edit.schedule[5].end"
										   :disabled="!$store.edit.weekmask[5]"/>
									<input type="checkbox" x-model="$store.edit.weekmask[5]">
								</div>
								<div style="display: flex; flex-direction: column; width: fit-content;
											gap:5px;"
									 :class="$store.edit.weekmask[6] ? '' : 'disabled'">
									<span style="text-align:center;">Su</span>
									<input type="time"
										   x-model="$store.edit.schedule[6].start"
										   :disabled="!$store.edit.weekmask[6]"/>
									<input type="time"
										   x-model="$store.edit.schedule[6].end"
										   :disabled="!$store.edit.weekmask[6]"/>
									<input type="checkbox" x-model="$store.edit.weekmask[6]">
								</div>
							</div>
                            <button type="submit">Muokkaa</button>
                        </div>
                        <div>
                            <calendar-component id="calendar"></calendar-component>
                        </div>
                    </fieldset>
                </form>
                </div>
            <div>
                <h2>Global calendar</h2>
                <calendar-component id="gcalendar"></calendar-component>
                <button id="addholidays">Add holidays</button>
                <button id="setworkdays">Set workdays</button>
            </div>
        </main>
	</body>
	<script type="module">
		import { io } from "https://cdn.socket.io/4.8.3/socket.io.esm.min.js";
		import Alpine from "/static/alpine.js";
		
		const socket = io();
		window.Alpine = Alpine;
		
        async function getStudents() {
			try {
				const response = await fetch("/api/students");
				if (!response.ok) {
					throw new Error("Jotain meni pieleen: " + response.status);
				}
				Alpine.store('info', {
					students: await response.json()
				});
			} catch (e) {
				console.error(e.message);
			} finally {
				studentTimer = setTimeout(() => {getStudents()}, 60 * 1000);
			}
        }
        await getStudents();

		Alpine.store('add', {
			rfid_id: "",
			name: ""
		});
		
		Alpine.store('edit', {
			student: null,
			editing: false,
			weekmask: [true, false, true, false, true, false, true], // Debug value
			schedule: null
		});

		socket.on('new_scan', (data) => {
			const rfid_id = data.rfid_id;
			const in_database = data.found;
			if (in_database) {				
				const name = data.name;
				popup(`${rfid_id} on jo tietokannassa nimellä ${name}`);
				Alpine.store('info').students.find((student) => student.id == id).status = status;
			} else {
				Alpine.store('add').rfid_id = rfid_id;
				popup(`RFID_ID: ${rfid_id} skannattu! `);
			}
		});

		socket.on('new_student', (data) => {
			popup(`RFID_ID: ${data.rfid_id} lisätty pöytään nimellä ${data.name}`);
			Alpine.store('info').students.push(data);
		});

		socket.on('update_student', (data) => {
 			const index = Alpine.store('info').students.findIndex((student) => student.id == data.id);
			Alpine.store('info').students[index] = data;
			popup(`Päivitetty oppilas: ${data.name}`);
		});

		socket.on('remove_student', (data) => {
			Alpine.store('info').students =
				Alpine.store('info').students.filter((student) => student.id != data.id);
			popup(`Poistettu oppilas: ${data.name}`);
		});

		socket.on('update_all', (data) => {
			Alpine.store('info').students = data;
			popup(`Päivitetty oppilaat`);
		});
		
		const addForm = document.getElementById('add');
		addForm.addEventListener('submit', (event) => {
			event.preventDefault();
			const name = Alpine.store('add').name;
			const rfid_id = Alpine.store('add').rfid_id;
			const calendar = document.getElementById("add_calendar");			
			const schedule = [
				{
					"name": "Monday",
					"start": "09:00",
					"end": "16:00"
				},
				{
					"name": "Tuesday",
					"start": "08:00",
					"end": "16:00"
				},
				{
					"name": "Wednesday",
					"start": "08:00",
					"end": "16:00"
				},
				{
					"name": "Thursday",
					"start": "08:00",
					"end": "16:00"
				},
				{
					"name": "Friday",
					"start": "08:00",
					"end": "16:00"
				},
				{
					"name": "Saturday",
					"start": "08:00",
					"end": "16:00"
				},
				{
					"name": "Sunday",
					"start": "08:00",
					"end": "16:00"
				}
			];
		

            if (!name) {
                popup("Nimi vaaditaan");
                return;
            }
            if (!rfid_id) {
                popup("Skannaa RFID tagi oppilaalle");
                return;
            }
            if (!calendar.endDate || !calendar.startDate || !schedule ) {
                popup("Täytä oppilaan kalenteri");
                return;
            }
			socket.emit("add_student", {
				name : name,
				rfid_id : rfid_id,
				start_date : jsDateToSQL(calendar.startDate, "08:00"),
				end_date : jsDateToSQL(calendar.endDate, "16:00"),
				excluded_days : JSON.stringify(calendar.holidays),
				schedule : JSON.stringify(schedule)
			});
			return false;
		});

		// Global calendar
		document.getElementById("setworkdays").addEventListener('click', (event) => {
			event.preventDefault();
			const start = jsDateToSQL(document.getElementById("gcalendar").startDate,
									  "08:00");
			const end = jsDateToSQL(document.getElementById("gcalendar").endDate,
									"16:00");
			socket.emit("set_workdays", {start : start, end : end});
			return false;
		});
		document.getElementById("addholidays").addEventListener('click', (event) => {
			event.preventDefault();
			const holidays = document.getElementById("gcalendar").holidays;
			socket.emit("add_holidays", {holidays : holidays});
			return false;
		});
		
		const jsDateToSQL = (jsdate, time) => (`${jsdate.split("-").reverse().map(Calendar.pad).join(".")} ${time}:00`);
		const SQLDateToJs = (sqldate) => (sqldate.split(" ")[0]).split(" ")[0].split(".").reverse().map(Calendar.pad).join("-");
		const weekString = (arr) => (arr.reduce((str, x) => str + Number(x).toString(),""));
		const weekArray = (str) => (str.split("").reduce((arr, c) => arr.concat(Boolean(parseInt(c))),[]));

		window.editStudent = (student) => {
			if (Alpine.store('edit').editing &&
				Alpine.store('edit').student != null &&
				Alpine.store('edit').student.id == student.id) {
				Alpine.store('edit').editing = false;
				return;
			}
			Alpine.store('edit').student = student;
			Alpine.store('edit').editing = true;
			Alpine.store('edit').weekmask = weekArray(student.weekmask);
			Alpine.store('edit').schedule = JSON.parse(student.schedule);

			const calendar = document.getElementById("calendar");
			calendar.year = (new Date()).getFullYear();
			calendar.month = (new Date()).getMonth() + 1;
			calendar.startDate = SQLDateToJs(student.start_date);
			calendar.endDate = SQLDateToJs(student.end_date);
			calendar.weekmask = student.weekmask;
			calendar.holidays = JSON.parse(student.excluded_days);
		}
		window.deleteStudent = (student) => {
			socket.emit("delete_student", {id : student.id});
		}

		let popupInitialized = false;
		window.removePopup = (() => {
			if (popupInitialized) {
				document.getElementById("popup_calendar").style.display = "none";
				popupInitialized = false;
			} else {
				popupInitialized = true;
			}
		});
		
        window.openCalendar = (event, student) => {
            const calendar = document.getElementById("popup_calendar");
			calendar.style.display = "";
			calendar.editable = false;
			calendar.holidays = student.excluded_days;
			calendar.startDate = SQLDateToJs(student.start_date);
			calendar.endDate = SQLDateToJs(student.end_date);
			calendar.weekmask = student.weekmask;
			document.body.append(calendar);
            calendar.style.position = "absolute"
            calendar.style.top = `${event.clientY + 20}px`
            calendar.style.left = `${event.clientX - (calendar.offsetWidth / 2)}px`
        }

		const editForm = document.getElementById('edit');
		editForm.addEventListener('submit', (event) => {
			event.preventDefault();
			const new_student = Alpine.store('edit').student;
			if (schedule.some((day) => day.start > day.end)) {
			const schedule = Alpine.store('edit').schedule ;	
			popup("Päivä ei voi alkaa sen jälkeen kuin se on loppunut");
				return false;
			}
			
			const dates = { start_date : jsDateToSQL(document.getElementById("calendar").startDate,
													 "08:00"),
							end_date : jsDateToSQL(document.getElementById("calendar").endDate,
												   "16:00"),
							excluded_days : JSON.stringify(document.getElementById("calendar").holidays),
							weekmask : weekString(Alpine.store('edit').weekmask),
							schedule : JSON.stringify(schedule)
						  };
			Object.assign(new_student, dates);
			socket.emit("edit_student", new_student);
			return false;
		});
		Alpine.start();
	</script>
</html>
